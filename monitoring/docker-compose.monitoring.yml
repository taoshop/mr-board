# ============================================================
# MR Board System - Monitoring Stack (Prometheus + Grafana)
# ============================================================
# Usage:
#   docker compose -f docker-compose.yml -f monitoring/docker-compose.monitoring.yml up -d
#
# After startup:
#   Prometheus:  http://localhost:9090
#   Grafana:     http://localhost:3000  (admin / admin)
#
# To import the MR Board dashboard in Grafana:
#   1. Open http://localhost:3000 → Login
#   2. Go to Dashboards → Import
#   3. Upload monitoring/grafana/mr-board-dashboard.json
#   4. Select the Prometheus data source (auto-detected)
# ============================================================

version: '3.8'

services:
  prometheus:
    image: prom/prometheus:v2.47.0
    container_name: mr-board-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    networks:
      - default

  grafana:
    image: grafana/grafana:10.1.0
    container_name: mr-board-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_INSTALL_PLUGINS=
      - GF_AUTH_ANONYMOUS_ENABLED=false
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/mr-board-dashboard.json:/etc/grafana/provisioning/dashboards/mr-board.json:ro
    networks:
      - default

volumes:
  prometheus_data:
  grafana_data:
