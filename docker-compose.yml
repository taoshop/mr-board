# ============================================================
# MR Board System - Docker Compose
# Phase 1 Infrastructure
# ============================================================

version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: mr-board-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: MrBoard@2026
      MYSQL_DATABASE: mr_board
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./db/init.sql:/docker-entrypoint-initdb.d/01-init.sql
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: mr-board-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: ./mr-board
      dockerfile: Dockerfile
    container_name: mr-board-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: test
      MYSQL_PASSWORD: MrBoard@2026
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-mr-board-access-secret-key-2026-07-25-very-long}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-mr-board-refresh-secret-key-2026-07-25-very-long}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./mr-board-frontend
      dockerfile: Dockerfile
    container_name: mr-board-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  mysql_data:
  redis_data:
